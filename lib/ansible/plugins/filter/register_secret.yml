DOCUMENTATION:
  name: register_secret
  author: Ansible Core Team
  version_added: "2.22"
  short_description: Register a value as a secret so it is masked in output
  description:
    - Registers the input value with Ansible's secret masker so that it is redacted from output that Ansible masks,
      such as display output, and module logging.
    - Registration is non-destructive; the value is returned unchanged so it can still be used by its true value,
      for example by registering it inline while assigning it to a variable.
    - Only string values can be registered, other types will raise an error.
  positional: _input
  options:
    _input:
      description: The value to register as a secret.
      type: string
      required: true
  seealso:
    - plugin: ansible.builtin.mask_secrets
      plugin_type: filter

EXAMPLES: |
  # Register a value as a secret and assign it in one step; later uses of my_secret are masked in output.
  my_secret: "{{ lookup('env', 'API_TOKEN') | register_secret }}"

RETURN:
  _value:
    description: The input value, unchanged.
    type: string
