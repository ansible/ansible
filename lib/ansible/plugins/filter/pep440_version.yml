DOCUMENTATION:
  name: pep440_version
  version_added: "2.20"
  short_description: compare version strings that may conform to a PEP 440 version string format
  description:
    - Allow user to compare version strings that may conform to a PEP 440 version string format.
  positional: _input
  options:
    _input:
      description: A string consisting of a version string.
      type: string
      required: true
EXAMPLES: |
  - name: test pep440_version with less than equal
  - assert:
      that:
        - "'1.0.0' | pep440_version <= '1.1.0' | pep440_version"
RETURN:
  _value:
    description: A PEP440Version object
    type: object
