DOCUMENTATION:
  name: loose_version
  version_added: "2.20"
  short_description: compare version strings that may not conform to a strict numeric format
  description:
    - Allow user to compare version strings that may not conform to a strict numeric format.
  positional: _input
  options:
    _input:
      description: A string consisting of a version string.
      type: string
      required: true
EXAMPLES: |
  - name: test loose_version with less than equal
  - assert:
      that:
        - "'1.0.0' | loose_version <= '1.1.0' | loose_version"
RETURN:
  _value:
    description: A LooseVersion object
    type: object
