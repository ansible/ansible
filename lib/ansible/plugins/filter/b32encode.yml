DOCUMENTATION:
  name: b32encode
  author: ansible core team
  version_added: 'historical'
  short_description: Encode a string as Base32
  description:
    - Base32 encoding function.
  positional: _input
  options:
    _input:
      description: A string to encode.
      type: string
      required: true
    encoding:
      description:
        - The encoding to use to transform from a text string to a byte string.
        - Defaults to using 'utf-8'.
      type: string
      required: false
    urlsafe:
      description:
        - Noop to align with b64decode syntax. Base32 is always urlsafe.
      type: bool
      default: true
      required: false

EXAMPLES: |
  # Base32 encode a string
  b32lola: "{{ 'lola'| b32encode }}"

  # Base32 encode the content of 'stuff' variable
  b32stuff: "{{ stuff | b32encode }}"

  # Base32 encode the content with different encoding
  b32stuff: "{{ 'Ansible - くらとみ\n' | b32encode(encoding='utf-16-le') }}"
  # => 'IEAG4ADTABUQAYQANQAGKABAAAWQAIAAJ4YISMDIGB7TACQA'

  # URL-safe Base32 encoding
  b32stuff: "{{ 'https://www.python.org/example-1' | b32encode(urlsafe=True) }}"
  # => 'NB2HI4DTHIXS653XO4XHA6LUNBXW4LTPOJTS6ZLYMFWXA3DFFUYQ===='

RETURN:
  _value:
    description: A Base32 encoded string.
    type: string
