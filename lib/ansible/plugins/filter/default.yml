DOCUMENTATION:
  name: default
  version_added: "jinja"
  short_description: Provide a default value.
  description:
    - If the input value is undefined, provide a default value instead.
  positional: _input
  options:
    _input:
      description: Mandatory input expression.
      type: raw
      required: true
    default_value:
      description: Value to return
      type: raw
      required: true
    boolean:
      description: Expand the cases in which the default value is retruned to include 'boolean falses'.
      type: bool
      required: false
      default: false
EXAMPLES: |

    # simple example
    {{ notdefined | default('default_value') }}

    # also return on boolean false
    {{ false |default('myvalue', true) }}

RETURN:
  _value:
    description: The default value provided
    type: raw
