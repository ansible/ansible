DOCUMENTATION:
  name: mask_secrets
  author: Ansible Core Team
  version_added: "2.22"
  short_description: Redact registered secrets from a string
  description:
    - Returns a copy of the input string with every registered secret it contains replaced by a placeholder.
    - Only values previously registered with the secret masker (for example via the P(ansible.builtin.register_secret#filter) filter)
      are redacted; other text is returned unchanged.
  positional: _input
  options:
    _input:
      description: The string to redact registered secrets from.
      type: string
      required: true
    mask_placeholder:
      description: The text to substitute in place of each registered secret.
      type: string
      default: "$REDACTED$"
      required: false
  seealso:
    - plugin: ansible.builtin.register_secret
      plugin_type: filter

EXAMPLES: |
  # Redact any registered secret that appears in a string.
  safe_line: "{{ ('token=' ~ api_token) | mask_secrets }}"

  # Redact using a custom placeholder.
  safe_line: "{{ some_text | mask_secrets(mask_placeholder='***') }}"

RETURN:
  _value:
    description: The input string with any registered secrets replaced by the placeholder.
    type: string
