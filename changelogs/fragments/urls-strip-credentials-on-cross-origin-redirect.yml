minor_changes:
  - urls - ``fetch_url``, ``open_url`` and the modules built on them (``uri``, ``get_url``) no longer forward the ``Authorization``, ``Proxy-Authorization``, ``Cookie``, ``Set-Cookie`` and ``WWW-Authenticate`` headers when a redirect changes the scheme, host or port of the original request, matching urllib's own authentication handlers and other HTTP clients. Other headers still follow the redirect; use ``unredirected_headers`` to hold them back. The ``follow_redirects=urllib2`` compatibility mode is unchanged.
  - uri - new ``redirect_default_ports`` option (also accepted by ``open_url`` and ``Request``) to set the port assumed per URL scheme when a URL states none, for deciding whether a redirect stays within the original origin. Defaults to 80 for ``http`` and 443 for ``https``.
