minor_changes:
  - >-
    Secret masking - add the internal ``_SECRETS_INPUT_FILES`` config option to pre-seed values to
    redact from output. Each file is YAML or JSON containing a mapping with a ``version`` key
    (currently only ``1``) and a ``secrets`` key listing the string values to mask. A file with the
    executable bit set is run instead of read, and its stdout is parsed as the document.
