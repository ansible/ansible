bugfixes:
  - lineinfile - when ``backrefs=true`` and ``create=true`` were used on a file that does not exist,
    the module created missing parent directories and either reported success without creating the file,
    or failed with an unhandled ``FileNotFoundError`` if file attributes such as ``mode`` were set.
    It now fails with a clear error and creates nothing (https://github.com/ansible/ansible/issues/71828).
deprecated_features:
  - lineinfile - using ``create=true`` with ``backrefs=true`` is deprecated and will be rejected in ansible-core 2.26.
    ``backrefs`` never creates a missing file, so the combination cannot do what it implies.
