minor_changes:
  - get_url, uri, url lookup - the values of user supplied sensitive headers (``Authorization``, ``Cookie``,
    ``Proxy-Authorization``, ``Set-Cookie`` and ``WWW-Authenticate``) are registered as secrets so they are
    redacted from output.
  - uri - the values of sensitive headers (``Set-Cookie``, ``WWW-Authenticate``, and others) returned in the
    response are registered as secrets so they are redacted from output.
