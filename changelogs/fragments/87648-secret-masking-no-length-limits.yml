minor_changes:
  - >-
    Secret masking - removed the minimum and maximum secret length limits introduced in ansible-core 2.22.0b1. Secrets of any length are now registered
    and redacted wherever they appear, short secrets are no longer restricted to whole word matches, and long secrets are matched on their full value
    rather than their first 65536 characters. Surrounding whitespace is still stripped before registration and values that are empty after stripping
    are ignored.
  - >-
    register_secret filter - the ``validation_action`` now applies when the secret is empty after trimming surrounding whitespace rather than when it is
    less than 4 characters long.
