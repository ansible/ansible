bugfixes:
  - Display class exceptions from parent when method call was passed through from child are now correclty captured in child.
minor_changes:
  - Display class with removed == True does not raise an exception anymore, callers should use ``get_deprecation_mesage`` and raise it themselves.
  - modules, when executing one that has been removed the core engine will now raise an exception, matching the old behavior from display + remote=True.
