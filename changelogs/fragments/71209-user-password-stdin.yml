security_fixes:
  - >-
    user - on Linux distributions using shadow-utils, set the password hash with ``chpasswd -e`` reading from stdin
    instead of passing it to ``useradd -p`` / ``usermod -p``, so the hash is no longer visible in the process list
    while the command runs. If ``chpasswd`` is not available, or rejects the value (newer shadow-utils validate the hash), the previous behavior is kept.
    ``local=true`` (libuser) and other platforms are unchanged (https://github.com/ansible/ansible/issues/71209).
