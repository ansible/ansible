major_changes:
  - >-
    Secret masking - add the ``ansible.module_utils.secrets`` public API for working with secrets manually. It provides ``register_secret`` and
    ``register_secrets`` to register values that should be redacted from masked output, and ``mask_secrets`` to redact any registered secrets from a string.
    Any value registered as a secret will be masked in output that Ansible generates, such as ``display`` output and module logging.
  - >-
    Module options that are marked as ``no_log: true`` will no longer be redacted literally as ``"VALUE_SPECIFIED_IN_NO_LOG_PARAMETER"`` in the module result.
    Instead, the actual value will be registered as a secret and redacted from output allowing these values to be used without any loss of data. The secret
    will still be redacted in the callback and module logging output.
