# Test the depth option and fetching revisions that were ignored first

- name: DEPTH | clear checkout_dir
  file:
    state: absent
    path: "{{ checkout_dir }}"

- name: DEPTH | Clone example git repo with depth 1
  git:
    repo: 'file://{{ repo_dir|expanduser }}/shallow'
    dest: '{{ checkout_dir }}'
    depth: 1

- name: DEPTH | try to access earlier commit
  command: "git checkout {{git_shallow_head_1.stdout}}"
  register: checkout_early
  failed_when: False
  args:
    chdir: '{{ checkout_dir }}'

- name: DEPTH | make sure the old commit was not fetched
  assert:
    that: 'checkout_early.rc != 0'
  when: git_version.stdout is version(git_version_supporting_depth, '>=')

# tests https://github.com/ansible/ansible/issues/14954
- name: DEPTH | fetch repo again with depth=1
  git:
    repo: 'file://{{ repo_dir|expanduser }}/shallow'
    dest: '{{ checkout_dir }}'
    depth: 1
  register: checkout2

- assert:
    that: "checkout2 is not changed"
  when: git_version.stdout is version(git_version_supporting_depth, '>=')

- name: DEPTH | again try to access earlier commit
  shell: "git checkout {{git_shallow_head_1.stdout}}"
  register: checkout_early
  failed_when: False
  args:
    chdir: '{{ checkout_dir }}'

- name: DEPTH | again make sure the old commit was not fetched
  assert:
    that: 'checkout_early.rc != 0'
  when: git_version.stdout is version(git_version_supporting_depth, '>=')

# make sure we are still able to fetch other versions
- name: DEPTH | Clone same repo with older version
  git:
    repo: 'file://{{ repo_dir|expanduser }}/shallow'
    dest: '{{ checkout_dir }}'
    depth: 1
    version: earlytag
  register: cloneold

- assert:
    that: cloneold is successful

- name: DEPTH | try to access earlier commit
  shell: "git checkout {{git_shallow_head_1.stdout}}"
  args:
    chdir: '{{ checkout_dir }}'

- name: DEPTH | clear checkout_dir
  file:
    state: absent
    path: "{{ checkout_dir }}"

# Test for https://github.com/ansible/ansible/issues/21316
- name: DEPTH | Shallow clone with tag
  git:
    repo: 'file://{{ repo_dir|expanduser }}/shallow'
    dest: '{{ checkout_dir }}'
    depth: 1
    version: earlytag
  register: cloneold

- assert:
    that: cloneold is successful

- name: DEPTH | remove remote HEAD from detached tag checkout
  file:
    path: "{{ checkout_dir }}/.git/refs/remotes/origin/HEAD"
    state: absent

- name: DEPTH | request HEAD without a remote HEAD reference
  git:
    repo: 'file://{{ repo_dir|expanduser }}/shallow'
    dest: '{{ checkout_dir }}'
    depth: "{{ item }}"
    version: HEAD
  loop:
    - 1
    - 0
  register: missing_remote_head
  ignore_errors: yes

- name: DEPTH | verify missing remote HEAD has an actionable error
  assert:
    that:
      - item is failed
      - "'Unable to determine HEAD branch from ' in item.msg"
      - "'Specify an explicit branch or tag with version.' in item.msg"
  loop: "{{ missing_remote_head.results }}"

- name: DEPTH | create a newer tag in the source repository
  command: git tag latertag
  args:
    chdir: "{{ repo_dir }}/shallow"

- name: DEPTH | fetch explicit revisions without remote HEAD
  git:
    repo: 'file://{{ repo_dir|expanduser }}/shallow'
    dest: '{{ checkout_dir }}'
    depth: 1
    version: "{{ item.version }}"
    refspec: "{{ item.refspec | default(omit) }}"
  loop:
    - version: earlytag
    - version: latertag
    - version: latertag
      refspec: '+refs/tags/latertag:refs/tags/latertag'
    - version: "{{ git_default_branch }}"
  register: detached_fetch

- name: DEPTH | verify detached tag fetches and idempotence
  assert:
    that:
      - detached_fetch.results[0] is not changed
      - detached_fetch.results[1] is changed
      - detached_fetch.results[1].after != cloneold.after
      - detached_fetch.results[2] is not changed

- name: DEPTH | read branch after switching from a detached tag
  command: git symbolic-ref --short HEAD
  args:
    chdir: "{{ checkout_dir }}"
  register: detached_fetch_branch

- name: DEPTH | verify the requested branch is checked out
  assert:
    that:
      - detached_fetch_branch.stdout == git_default_branch

- name: DEPTH | clear checkout_dir
  file:
    state: absent
    path: "{{ checkout_dir }}"


  # Test for https://github.com/ansible/ansible-modules-core/issues/3456
  # clone a repo with depth and version specified

- name: DEPTH | clone repo with both version and depth specified
  git:
    repo: 'file://{{ repo_dir|expanduser }}/shallow'
    dest: '{{ checkout_dir }}'
    depth: 1
    version: >-
      {{ git_default_branch }}

- name: DEPTH | run a second time (now fetch, not clone)
  git:
    repo: 'file://{{ repo_dir|expanduser }}/shallow'
    dest: '{{ checkout_dir }}'
    depth: 1
    version: >-
      {{ git_default_branch }}
  register: git_fetch

- name: DEPTH | ensure the fetch succeeded
  assert:
    that: git_fetch is successful


- name: DEPTH | clear checkout_dir
  file:
    state: absent
    path: "{{ checkout_dir }}"

- name: DEPTH | clone repo with both version and depth specified
  git:
    repo: 'file://{{ repo_dir|expanduser }}/shallow'
    dest: '{{ checkout_dir }}'
    depth: 1
    version: >-
      {{ git_default_branch }}

- name: DEPTH | switch to older branch with depth=1 (uses fetch)
  git:
    repo: 'file://{{ repo_dir|expanduser }}/shallow'
    dest: '{{ checkout_dir }}'
    depth: 1
    version: earlybranch
  register: git_fetch

- name: DEPTH | ensure the fetch succeeded
  assert:
    that: git_fetch is successful

- name: DEPTH | clear checkout_dir
  file:
    state: absent
    path: "{{ checkout_dir }}"

# test for https://github.com/ansible/ansible-modules-core/issues/3782
# make sure shallow fetch works when no version is specified

- name: DEPTH | checkout old repo
  git:
    repo: 'file://{{ repo_dir|expanduser }}/shallow'
    dest: '{{ checkout_dir }}'
    depth: 1

- name: DEPTH | "update repo"
  shell: echo "3" > a; git commit -a -m "3"
  args:
    chdir: "{{ repo_dir }}/shallow"

- name: DEPTH | fetch updated repo
  git:
    repo: 'file://{{ repo_dir|expanduser }}/shallow'
    dest: '{{ checkout_dir }}'
    depth: 1
  register: git_fetch
  ignore_errors: yes

- name: DEPTH | get "a" file
  slurp:
    src: '{{ checkout_dir }}/a'
  register: a_file

- name: DEPTH | check update arrived
  assert:
    that:
      - a_file.content | b64decode | int == 3
      - git_fetch is changed

- name: DEPTH | clear checkout_dir
  file:
    state: absent
    path: "{{ checkout_dir }}"

#
# Make sure shallow fetch works when switching to (fetching) a new a branch
#

- name: DEPTH | clone from branch with depth specified
  git:
    repo: 'file://{{ repo_dir|expanduser }}/shallow_branches'
    dest: '{{ checkout_dir }}'
    depth: 1
    version: test_branch

- name: DEPTH | check if clone is shallow
  stat: path={{ checkout_dir }}/.git/shallow
  register: is_shallow
  when: git_version.stdout is version(git_version_supporting_depth, '>=')

- name: DEPTH | assert that clone is shallow
  assert:
    that:
      - is_shallow.stat.exists
  when: git_version.stdout is version(git_version_supporting_depth, '>=')

- name: DEPTH | switch to new branch (fetch) with the shallow clone
  git:
    repo: 'file://{{ repo_dir|expanduser }}/shallow_branches'
    dest: '{{ checkout_dir }}'
    depth: 1
    version: new_branch
  register: git_fetch

- name: DEPTH | assert if switching a shallow clone to a new branch worked
  assert:
    that:
      - git_fetch is changed

- name: DEPTH | check if clone is still shallow
  stat: path={{ checkout_dir }}/.git/shallow
  register: is_shallow
  when: git_version.stdout is version(git_version_supporting_depth, '>=')

- name: DEPTH | assert that clone still is shallow
  assert:
    that:
      - is_shallow.stat.exists
  when: git_version.stdout is version(git_version_supporting_depth, '>=')

- name: DEPTH | clear checkout_dir
  file:
    state: absent
    path: "{{ checkout_dir }}"
