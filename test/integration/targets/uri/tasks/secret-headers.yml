- name: set sensitive header facts
  set_fact:
    # request header values supplied by the user, which must be registered as secrets
    secret_authorization: "Bearer UriAuthorization0001Secret"
    secret_cookie: "session=UriCookie0002Secret"
    secret_proxy_authorization: "Basic UriProxyAuthorization0003Secret"
    # response header values returned by the server, which must be registered as secrets
    secret_set_cookie: "session=UriSetCookie0004Secret"
    secret_www_authenticate: "Bearer realm=UriWwwAuthenticate0005Secret"
    # a request and a response header which must not be masked
    marker_header: "UriMarker0006NotSecret"

- name: request and receive sensitive headers
  vars:
    response_headers:
      Set-Cookie: "{{ secret_set_cookie }}"
      WWW-Authenticate: "{{ secret_www_authenticate }}"
      X-Marker: "{{ marker_header }}"
  uri:
    url: "https://{{ httpbin_host }}/response-headers?{{ response_headers | urlencode }}"
    headers:
      Authorization: "{{ secret_authorization }}"
      Cookie: "{{ secret_cookie }}"
      Proxy-Authorization: "{{ secret_proxy_authorization }}"
      X-Marker: "{{ marker_header }}"
  register: secret_headers

- name: ensure the sensitive headers were registered as secrets
  assert:
    that:
      # the values the user supplied are masked once the module has registered them and the
      # registration has propagated back to the controller
      - (secret_authorization | mask_secrets) == '$REDACTED$'
      - (secret_cookie | mask_secrets) == '$REDACTED$'
      - (secret_proxy_authorization | mask_secrets) == '$REDACTED$'
      # so are the sensitive headers returned in the response
      - (secret_headers.set_cookie | mask_secrets) == '$REDACTED$'
      - (secret_headers.www_authenticate | mask_secrets) == '$REDACTED$'
      # masking is non-destructive, the response still carries the real values
      - secret_headers.set_cookie == secret_set_cookie
      - secret_headers.www_authenticate == secret_www_authenticate
      # headers which are not sensitive are left alone
      - (marker_header | mask_secrets) == marker_header
      - (secret_headers.x_marker | mask_secrets) == marker_header
