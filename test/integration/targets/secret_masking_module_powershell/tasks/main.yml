---
- name: run the module through an action plugin that checks masking during result processing
  run_module_check:
    incoming: "{{ 'IncomingPwshSecret' | register_secret }}"
    register_as_secret: InlineDiscoveredPwshSecret
    no_log_option: NoLogPwshOptionSecret
  register: pwsh_module

- name: assert the module-side masking API behaved as expected
  assert:
    that:
    # MaskString(value) redacted all three registered values with the default placeholder
    - pwsh_module.masked == '$REDACTED$ $REDACTED$ $REDACTED$'
    # MaskString(value, placeholder) honours a custom placeholder
    - pwsh_module.masked_custom == '<HIDDEN>'
    # the discovered value is returned unchanged (non-destructive), so it is still usable by its
    # true value even though the controller masks it at Display egress
    - pwsh_module.discovered == 'PwshModuleSecret1'
    # the already-registered secret arrived as the literal value in the module params ...
    - pwsh_module.incoming == 'IncomingPwshSecret'
    # ... but MaskString redacts it because the controller propagated the registration
    - pwsh_module.incoming_masked == '$REDACTED$'
    # the runtime-discovered option value is echoed back by its true value (non-destructive)
    - pwsh_module.register_as_secret == 'InlineDiscoveredPwshSecret'
    # a no_log option value is automatically registered as a secret, so the module masks it ...
    - pwsh_module.no_log_option_masked == '$REDACTED$'
    # ... but masking is non-destructive: the true value still comes back in the result data
    - pwsh_module.no_log_option == 'NoLogPwshOptionSecret'
    fail_msg: module-side secret masking API did not behave as expected

- name: confirm the module-registered secrets still mask in a later task
  assert_propagated:
    secrets:
    - PwshModuleSecret1
    - PwshModuleSecret2
    - PwshModuleSecret3
    - InlineDiscoveredPwshSecret
    - NoLogPwshOptionSecret
