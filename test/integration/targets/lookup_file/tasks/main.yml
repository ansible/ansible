- name: make a new file to read
  copy: dest={{output_dir}}/foo.txt mode=0644 content="bar"

- name: load the file as a fact
  set_fact:
    foo: "{{ lookup('file', output_dir + '/foo.txt' ) }}"

- debug: var=foo

- name: verify file lookup
  assert:
    that:
        - "foo == 'bar'"

- name: load the file name as a list
  set_fact:
    foo: "{{ lookup('file', ['hello.txt']) }}"
  ignore_errors: yes
  register: file_list

- name: assert that file raises an error
  assert:
    that:
        - file_list.failed
        - "'File name must be' in file_list.msg"
