# https://github.com/ansible/ansible/issues/82114
# Keywords set with 'apply' are inherited by nested includes.
# The outer include applies a normal tag and an environment variable.
# Both must reach every nested task, at any depth.
- hosts: testhost
  gather_facts: false
  tasks:
    - include_tasks:
        file: nested/outer.yml
        apply:
          tags:
            - outer
          environment:
            APPLY_NESTED_ENV: inherited
      tags:
        - always
