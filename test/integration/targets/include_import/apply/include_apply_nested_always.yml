# https://github.com/ansible/ansible/issues/82114
# Keywords set with 'apply' are inherited by nested includes.
# Because the outer include applies the 'always' tag, every nested task runs,
# no matter which tags are selected with --tags.
- hosts: testhost
  gather_facts: false
  tasks:
    - include_tasks:
        file: nested/outer.yml
        apply:
          tags:
            - always
      tags:
        - always
