- name: Use iptables with unnecessary extension match
  iptables:
    chain: INPUT
    source: 8.8.8.8
    jump: DROP
    match: comment
    comment: Here to include an extension
  register: unnecessary_extension

- name: Assert success
  assert:
    that:
      - unnecessary_extension is success
      - unnecessary_extension.rule.count('-m comment') == 1
