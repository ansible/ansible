---
- name: Include distribution specific variables
  include_vars: "{{ lookup('first_found', search) }}"
  vars:
    search:
      files:
        - '{{ ansible_distribution | lower }}.yml'
        - '{{ ansible_os_family | lower }}.yml'
        - '{{ ansible_system | lower }}.yml'
        - default.yml
      paths:
        - vars

- name: install dependencies for iptables test, on non-RHEL
  package:
    name: iptables
    state: present
  when: ansible_distribution != 'RedHat'

- name: install dependencies for iptables test, on RHEL
  dnf:
    name:
      - iptables
      - kernel-modules-extra-{{ ansible_facts.kernel }}  # provides xt_comment for `-m comment` tests
    state: present
    allow_downgrade: true  # in case a newer kernel-modules-extra is already installed, this would install the one we need alongside it
  when: ansible_distribution == 'RedHat'

- import_tasks: xt_comment.yml
- import_tasks: chain_management.yml
