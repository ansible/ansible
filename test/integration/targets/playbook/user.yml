- hosts: localhost
  tasks:
    - command: whoami
      register: whoami

    - assert:
        that:
          - whoami is successful

    - set_fact:
        me: "{{ whoami.stdout }}"

- hosts: localhost
  user: "{{ me }}"
  tasks:
    - name: should not happen
      debug:
        msg: worked with user ({{ me }})
