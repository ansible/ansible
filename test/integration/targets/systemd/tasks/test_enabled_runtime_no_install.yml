# Simulates a unit enabled by a systemd generator, which cannot be enabled persistently
# https://github.com/ansible/ansible/issues/86214
# The unit file is outside /etc/systemd/system so the unit can also be masked.
- name: Copy unit file without an Install section
  template:
    src: qux.service
    dest: /usr/lib/systemd/system/qux.service
    owner: root
    group: root
    mode: '0644'
  notify: remove enabled-runtime unit file without Install section

- name: Create runtime wants directory
  file:
    path: /run/systemd/system/multi-user.target.wants
    state: directory

- name: Link the unit at runtime only
  file:
    src: /usr/lib/systemd/system/qux.service
    dest: /run/systemd/system/multi-user.target.wants/qux.service
    state: link
  notify: remove enabled-runtime unit file without Install section

- name: Reload systemd
  systemd:
    daemon_reload: true

- name: Check the unit is enabled-runtime
  command: systemctl is-enabled qux.service
  register: qux_is_enabled
  changed_when: false

- name: Enable enabled-runtime service without Install section
  systemd:
    name: qux.service
    enabled: true
  register: qux_test_1

- name: Enable enabled-runtime service without Install section again
  systemd:
    name: qux.service
    enabled: true
  register: qux_test_2

- assert:
    that:
      - qux_is_enabled.stdout == 'enabled-runtime'
      - qux_test_1 is not changed
      - qux_test_1 is success
      - qux_test_1.enabled
      - qux_test_2 is not changed
      - qux_test_2 is success

- name: Mask the unit
  systemd:
    name: qux.service
    masked: true

- name: Unmask and enable the unit in a single task
  systemd:
    name: qux.service
    masked: false
    enabled: true
  register: qux_test_3

- name: Check the mask symlink is gone
  stat:
    path: /etc/systemd/system/qux.service
  register: qux_mask_link

- assert:
    that:
      - not qux_mask_link.stat.exists
      - qux_test_3 is changed
      - qux_test_3 is success

- name: Remove the runtime link
  file:
    path: /run/systemd/system/multi-user.target.wants/qux.service
    state: absent

- name: Reload systemd
  systemd:
    daemon_reload: true

- name: Check the unit is static
  command: systemctl is-enabled qux.service
  register: qux_is_static
  changed_when: false

- name: Disable static service
  systemd:
    name: qux.service
    enabled: false
  register: qux_test_4

- assert:
    that:
      - qux_is_static.stdout == 'static'
      - qux_test_4 is not changed
      - qux_test_4 is success
