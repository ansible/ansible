- name: remove unit file
  file:
    path: /etc/systemd/system/sleeper@.service
    state: absent

- name: remove dummy indirect service
  file:
    path: "/etc/systemd/system/{{item}}"
    state: absent
  loop:
    - dummy.service
    - dummy.socket

- name: remove enabled-runtime unit file
  file:
    path: /etc/systemd/system/baz.service
    state: absent

- name: remove mask unit file
  file:
    path: /etc/systemd/system/mask_me.service
    state: absent

- name: remove enabled-runtime unit file without Install section
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /run/systemd/system/multi-user.target.wants/qux.service
    - /etc/systemd/system/qux.service
