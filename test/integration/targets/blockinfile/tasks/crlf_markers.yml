- name: Test updating and removing blocks with CRLF markers
  vars:
    crlf_path: "{{ remote_tmp_dir_test }}/crlf_markers.txt"
    crlf_original: "before\r\n# BEGIN ANSIBLE MANAGED BLOCK\r\nold\r\n# END ANSIBLE MANAGED BLOCK\r\nafter\r\n"
    crlf_updated: "before\r\n# BEGIN ANSIBLE MANAGED BLOCK\nnew\n# END ANSIBLE MANAGED BLOCK\nafter\r\n"
  block:
    - name: Create a file with CRLF markers
      copy:
        dest: "{{ crlf_path }}"
        content: "{{ crlf_original }}"

    - name: Update the CRLF block in check mode
      blockinfile:
        path: "{{ crlf_path }}"
        block: new
      check_mode: true
      diff: true
      register: crlf_check

    - name: Read the file after check mode
      slurp:
        src: "{{ crlf_path }}"
      register: crlf_content

    - name: Check the predicted update and unchanged file
      assert:
        that:
          - crlf_check is changed
          - crlf_check.diff[0].after == crlf_updated
          - crlf_content.content | b64decode == crlf_original

    - name: Update the existing CRLF block
      blockinfile:
        path: "{{ crlf_path }}"
        block: new
      register: crlf_update

    - name: Repeat the update
      blockinfile:
        path: "{{ crlf_path }}"
        block: new
      register: crlf_repeat

    - name: Read the updated file
      slurp:
        src: "{{ crlf_path }}"
      register: crlf_content

    - name: Check replacement, idempotency, and preservation of surrounding CRLF lines
      assert:
        that:
          - crlf_update is changed
          - crlf_repeat is not changed
          - crlf_content.content | b64decode == crlf_updated

    - name: Restore the original CRLF file for removal
      copy:
        dest: "{{ crlf_path }}"
        content: "{{ crlf_original }}"

    - name: Remove the existing CRLF block
      blockinfile:
        path: "{{ crlf_path }}"
        state: absent
      register: crlf_remove

    - name: Repeat the removal
      blockinfile:
        path: "{{ crlf_path }}"
        state: absent
      register: crlf_remove_repeat

    - name: Read the file after removal
      slurp:
        src: "{{ crlf_path }}"
      register: crlf_content

    - name: Check removal, idempotency, and preservation of surrounding CRLF lines
      assert:
        that:
          - crlf_remove is changed
          - crlf_remove_repeat is not changed
          - crlf_content.content | b64decode == "before\r\nafter\r\n"
