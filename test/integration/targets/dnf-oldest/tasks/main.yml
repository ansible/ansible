- when: ansible_distribution == "Fedora"
  block:
    - name: Downgrade the dnf5 stack to the original version
      command: dnf distro-sync -y --disable-repo=* --enable-repo=fedora --allowerasing libdnf5* dnf5* python3-libdnf5

    - name: Ensure the original python3-libdnf5 bindings are installed
      command: dnf install -y --disable-repo=* --enable-repo=fedora python3-libdnf5

    - name: Run DNF tests
      include_role:
        name: dnf
      vars:
        test_auto_install: false
