- hosts: all
  gather_facts: false
  max_fail_percentage: 24
  tasks:
    - name: Block with failure
      block:
        - name: "Task in block"
          fail:
            msg: "block failure"
          when: inventory_hostname == 'host1'
      rescue:
        - name: "Task in rescue"
          debug:
            msg: "rescue cleanup"
        - name: "Fail in rescue to ensure host is marked failed"
          fail:
            msg: "rescue fail"
      always:
        - name: "Task in always"
          debug:
            msg: "always cleanup"

    - name: Marker task
      set_fact:
        marker_task_run: true
