- name: ansible test user
  import_role:
    role: setup_test_user
  vars:
    test_user_allow_sudo: true

- name: setup ssh
  when: ansible_facts.system != 'Darwin'
  block:
    - name: find file
      ansible.builtin.find:
        paths: /etc/ssh
        recurse: true
        contains: PasswordAuthentication
      register: files_with_authentication

    - name: replace password authentication to yes
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: ^PasswordAuthentication
        line: PasswordAuthentication yes
      loop: "{{ files_with_authentication.files | default([{'path': '/etc/ssh/sshd_config'}], true) | map(attribute='path') }}"

    - name: restart ssh service
      ansible.builtin.service:
        name: ssh{{ '' if ansible_facts.os_family == 'Debian' else 'd' }}
        state: restarted

- name: run test script
  ansible.builtin.script: "{{ role_path }}/files/test_script.sh"
  become: true
  become_user: root
  register: script_result
  vars:
    ansible_connection: ssh
    ansible_become: true
    ansible_host: localhost
    ansible_user: "{{ test_user_name }}"
    ansible_password: "{{ test_user_plaintext_password }}"
    ansible_become_password: "{{ test_user_plaintext_password }}"
    ansible_ssh_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    ansible_ssh_password_mechanism: ssh_askpass

- name: assert script stdout
  ansible.builtin.assert:
    that:
      - script_result.stdout_lines == ['line1']
