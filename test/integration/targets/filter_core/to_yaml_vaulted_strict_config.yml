---
- name: Test the new config setting with to_yaml
  gather_facts: false
  hosts: localhost
  tasks:
  - name: Render inline with strict config set  # Registers a deprecation but doesn't display it?
    debug:
      msg: "{{ inline_vaulted | to_yaml }}"
    ignore_errors: true
    register: strict_inline

  - name: Render datastructure with strict config set
    debug:
      msg: "{{ housing_datastructure | to_yaml }}"
    ignore_errors: true
    register: strict_datastructure

  - name: Assert failure for strict mode
    assert:
      that:
        - strict_inline is failed
        - strict_datastructure is failed
