- name: ensure no templating unsafe
  block:
  - name: check unsafe string
    assert:
      that:
        - regstr != resolved
        - "'Fail' not in regstr"
        - "'{' in regstr"
        - "'}' in regstr"
    vars:
      regstr: !unsafe b{{nottemplate}}

  - name: check unsafe string in list
    assert:
      that:
        - ulist[0] != resolved
        - "'Fail' not in ulist[0]"
        - "'{' in ulist[0]"
        - "'}' in ulist[0]"
    vars:
      ulist: !unsafe [ 'b{{nottemplate}}', 'c', 'd']

  - name: check unsafe string in dict
    assert:
      that:
        - udict['a'] != resolved
        - "'Fail' not in udict['a']"
        - "'{' in udict['a']"
        - "'}' in udict['a']"
    vars:
      udict: !unsafe
        a: b{{nottemplate}}
        c: d

  - name: check unsafe scalars keep the type implied by their style
    assert:
      that:
        - unsafe_quoted_bool is string
        - unsafe_quoted_bool == 'yes'
        - unsafe_literal_bool is string
        - unsafe_literal_bool == 'yes'
        - unsafe_plain_bool is boolean
        - unsafe_plain_bool
        - unsafe_quoted_int is string
        - unsafe_quoted_int == '5'
        - unsafe_plain_int is integer
        - unsafe_plain_int == 5
        - unsafe_folded_octal is string
        - unsafe_folded_octal == '001234'
        - unsafe_plain_octal is integer
        - unsafe_plain_octal == 668

  vars:
    nottemplate: FAIL
    resolved: 'b{{nottemplate}}'
    unsafe_quoted_bool: !unsafe 'yes'
    unsafe_literal_bool: !unsafe |-
      yes
    unsafe_plain_bool: !unsafe yes
    unsafe_quoted_int: !unsafe '5'
    unsafe_plain_int: !unsafe 5
    unsafe_folded_octal: !unsafe >-
      001234
    unsafe_plain_octal: !unsafe 001234
