- name: set sensitive header facts
  set_fact:
    # request header values supplied by the user, which must be registered as secrets
    secret_authorization: "Bearer GetUrlAuthorization0001Secret"
    secret_cookie: "session=GetUrlCookie0002Secret"
    secret_proxy_authorization: "Basic GetUrlProxyAuthorization0003Secret"
    # a request header which must not be masked
    marker_header: "GetUrlMarker0004NotSecret"

- name: download a file using sensitive headers
  get_url:
    url: "https://{{ httpbin_host }}/get"
    dest: "{{ remote_tmp_dir }}/secret_headers.json"
    headers:
      Authorization: "{{ secret_authorization }}"
      Cookie: "{{ secret_cookie }}"
      Proxy-Authorization: "{{ secret_proxy_authorization }}"
      X-Marker: "{{ marker_header }}"
  register: secret_headers

- name: ensure the sensitive headers were registered as secrets
  assert:
    that:
      - secret_headers is changed
      # the values the user supplied are masked once the module has registered them and the
      # registration has propagated back to the controller
      - (secret_authorization | mask_secrets) == '$REDACTED$'
      - (secret_cookie | mask_secrets) == '$REDACTED$'
      - (secret_proxy_authorization | mask_secrets) == '$REDACTED$'
      # headers which are not sensitive are left alone
      - (marker_header | mask_secrets) == marker_header
