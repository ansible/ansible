---
- name: secret masking config secret scenarios
  hosts: localhost
  gather_facts: false

  tasks:
    - name: env source resolves to the known value in-playbook
      assert:
        that:
          - lookup('secret_probe', 'str_env') == 'Configenv0020Secret'
        quiet: true

    - name: env source is redacted at egress
      debug:
        msg: "SCN config_env: {{ lookup('secret_probe', 'str_env') }}"

    - name: ini source resolves to the known value in-playbook
      assert:
        that:
          - lookup('secret_probe', 'str_ini') == 'Configini0021Secret'
        quiet: true

    - name: ini source is redacted at egress
      debug:
        msg: "SCN config_ini: {{ lookup('secret_probe', 'str_ini') }}"

    - name: config secret from a vars source
      vars:
        secret_probe_vars: Configvars0022Secret
      block:
        - name: vars source resolves to the known value in-playbook
          assert:
            that:
              - lookup('secret_probe', 'str_vars') == 'Configvars0022Secret'
            quiet: true

        - name: vars source is redacted at egress
          debug:
            msg: "SCN config_vars: {{ lookup('secret_probe', 'str_vars') }}"

    - name: string plugin-arg resolves to the known value in-playbook
      assert:
        that:
          - lookup('secret_probe', 'string_direct', string_direct='Configstring0024Secret') == 'Configstring0024Secret'
        quiet: true

    - name: string plugin-arg is redacted at egress
      debug:
        msg: "SCN config_string: {{ lookup('secret_probe', 'string_direct', string_direct='Configstring0024Secret') }}"

    - name: list plugin-arg resolves to the known values in-playbook
      assert:
        that:
          - lookup('secret_probe', 'list_direct', list_direct=['Configlist0023Secret', 12345678]) == 'Configlist0023Secret,12345678'
        quiet: true

    - name: list plugin-arg redacts the string element but keeps the int at egress
      debug:
        msg: "SCN config_list: {{ lookup('secret_probe', 'list_direct', list_direct=['Configlist0023Secret', 12345678]) }}"
