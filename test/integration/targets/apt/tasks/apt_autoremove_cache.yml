- name: Check that a cache-only request retains its existing result
  apt:
    update_cache: true
    cache_valid_time: 86400
  register: cache_only_result

- name: Verify the cache-only result has no cleanup output
  assert:
    that:
      - cache_only_result.cache_updated is defined
      - cache_only_result.cache_update_time is defined
      - cache_only_result.stdout is not defined

- name: Autoclean with cache update options
  apt:
    autoclean: true
    update_cache: true
    cache_valid_time: 86400
  register: autoclean_result

- name: Verify autoclean ran after checking the cache
  assert:
    that:
      - autoclean_result.stdout is defined
      - autoclean_result.stderr is defined

- name: Check autoclean with a cache validity interval
  apt:
    autoclean: true
    cache_valid_time: 86400
  check_mode: true
  register: autoclean_check

- name: Verify autoclean ran in check mode
  assert:
    that:
      - autoclean_check.stdout is defined

- name: Install hello for cache and autoremove tests
  apt:
    name: hello
    state: present

- name: Mark hello as automatically installed
  command: apt-mark auto hello

- block:
    - name: Check autoremove with a cache validity interval
      apt:
        autoremove: true
        cache_valid_time: 86400
      check_mode: true
      register: autoremove_check

    - name: Verify that check mode finds the unused package
      assert:
        that:
          - autoremove_check is changed
          - "'hello' in autoremove_check.stdout"

    - name: Autoremove with cache update options
      apt:
        autoremove: true
        update_cache: true
        cache_valid_time: 86400
      register: autoremove_result

    - name: Verify that check mode left the package for removal
      assert:
        that:
          - autoremove_result is changed
          - "'hello' in autoremove_result.stdout"

    - name: Check that autoremove is idempotent
      apt:
        autoremove: true
        update_cache: true
        cache_valid_time: 86400
      check_mode: true
      register: autoremove_again

    - name: Verify there are no unused packages left
      assert:
        that:
          - autoremove_again is not changed

  always:
    - name: Remove hello after the autoremove test
      apt:
        name: hello
        state: absent
