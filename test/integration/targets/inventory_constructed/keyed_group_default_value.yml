plugin: ansible.builtin.constructed
keyed_groups:
  - key: tags
    prefix: tag
    default_value: "running"

  - key: omit
    prefix: omit_test
    default_value: default_value

  - key: invalid_var | default(None)
    prefix: none_test
    default_value: default_value

  - key: '""'
    prefix: empty_test
    default_value: default_value
