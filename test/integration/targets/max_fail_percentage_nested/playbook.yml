- hosts: all
  gather_facts: false
  max_fail_percentage: 24
  tasks:
    - name: Block with failure
      block:
        - fail:
            msg: "block failure"
          when: inventory_hostname == 'host1'
      rescue:
        - fail:
            msg: "rescue fail"
      always:
        - debug:
            msg: "always cleanup"

    - name: Marker task
      set_fact:
        marker_task_run: true
