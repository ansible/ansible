- name: xattrs preservation tests
  block:
    - name: Install attr (Debian/Ubuntu)
      apt:
        name: attr
      when: ansible_pkg_mgr == 'apt'

    - name: Install attr (RedHat)
      dnf:
        name: attr
      when: ansible_pkg_mgr == 'dnf'

    - name: Create a controller-side source file
      copy:
        content: 'xattr-source-content'
        dest: '{{ local_temp_dir }}/xattr_src.txt'
      delegate_to: localhost

    - name: Tag the source with two user xattrs on the controller
      command: '{{ item }}'
      delegate_to: localhost
      loop:
        - setfattr -n user.ansible_test -v 'hello-xattrs' {{ local_temp_dir }}/xattr_src.txt
        - setfattr -n user.ansible_extra -v 'extra-tag' {{ local_temp_dir }}/xattr_src.txt
      register: setfattr_src
      ignore_errors: yes

    - name: Skip the rest if the controller filesystem does not support xattrs
      meta: end_play
      when: setfattr_src is failed

    # 1. preserve_xattrs=no -> destination has no source xattrs.
    - name: Copy with preserve_xattrs=no should not carry xattrs across
      copy:
        src: '{{ local_temp_dir }}/xattr_src.txt'
        dest: '{{ remote_dir }}/xattr_no.txt'
        preserve_xattrs: no
      register: copy_no

    - command: getfattr --absolute-names -d -m '^user\.' {{ remote_dir }}/xattr_no.txt
      register: xattrs_no
      changed_when: false
      failed_when: false

    - assert:
        that:
          - copy_no is changed
          - "'user.ansible_test' not in xattrs_no.stdout"

    # 2. preserve_xattrs=source -> source xattrs propagate.
    - name: Copy with preserve_xattrs=source
      copy:
        src: '{{ local_temp_dir }}/xattr_src.txt'
        dest: '{{ remote_dir }}/xattr_source.txt'
        preserve_xattrs: source
      register: copy_source

    - command: getfattr --absolute-names -d -m '^user\.' {{ remote_dir }}/xattr_source.txt
      register: xattrs_source_dump
      changed_when: false

    - assert:
        that:
          - copy_source is changed
          - "'user.ansible_test=\"hello-xattrs\"' in xattrs_source_dump.stdout"
          - "'user.ansible_extra=\"extra-tag\"' in xattrs_source_dump.stdout"

    # 3. Re-run is idempotent.
    - name: Re-run preserve_xattrs=source is idempotent
      copy:
        src: '{{ local_temp_dir }}/xattr_src.txt'
        dest: '{{ remote_dir }}/xattr_source.txt'
        preserve_xattrs: source
      register: copy_source_second

    - assert:
        that:
          - copy_source_second is not changed

    # 4. Source xattr mutated, content unchanged -> xattrs reconciled without forcing a full copy.
    - name: Mutate the source xattr on the controller
      command: setfattr -n user.ansible_test -v 'changed-value' {{ local_temp_dir }}/xattr_src.txt
      delegate_to: localhost

    - name: Copy again, content unchanged but xattrs differ
      copy:
        src: '{{ local_temp_dir }}/xattr_src.txt'
        dest: '{{ remote_dir }}/xattr_source.txt'
        preserve_xattrs: source
      register: copy_source_mutated

    - command: getfattr --absolute-names -d -m '^user\.' {{ remote_dir }}/xattr_source.txt
      register: xattrs_after_mutation
      changed_when: false

    - assert:
        that:
          - copy_source_mutated is changed
          - "'user.ansible_test=\"changed-value\"' in xattrs_after_mutation.stdout"

    # 5. preserve_xattrs=target keeps whatever the destination already had.
    - name: Pre-tag a destination with its own xattr
      copy:
        content: 'target-existing-content'
        dest: '{{ remote_dir }}/xattr_target.txt'

    - command: setfattr -n user.target_only -v 'target-value' {{ remote_dir }}/xattr_target.txt

    - name: Copy with preserve_xattrs=target keeps target's xattr
      copy:
        src: '{{ local_temp_dir }}/xattr_src.txt'
        dest: '{{ remote_dir }}/xattr_target.txt'
        preserve_xattrs: target

    - command: getfattr --absolute-names -d -m '^user\.' {{ remote_dir }}/xattr_target.txt
      register: xattrs_target_dump
      changed_when: false

    - assert:
        that:
          - "'user.target_only=\"target-value\"' in xattrs_target_dump.stdout"
          - "'user.ansible_test' not in xattrs_target_dump.stdout"
        fail_msg: 'preserve_xattrs=target should keep target xattrs and not pull in source xattrs'

    # 6. preserve_xattrs=merge combines target's xattrs with the source's.
    - name: Pre-tag another destination
      copy:
        content: 'merge-existing-content'
        dest: '{{ remote_dir }}/xattr_merge.txt'

    - command: setfattr -n user.target_only -v 'keep-me' {{ remote_dir }}/xattr_merge.txt

    - name: Copy with preserve_xattrs=merge
      copy:
        src: '{{ local_temp_dir }}/xattr_src.txt'
        dest: '{{ remote_dir }}/xattr_merge.txt'
        preserve_xattrs: merge

    - command: getfattr --absolute-names -d -m '^user\.' {{ remote_dir }}/xattr_merge.txt
      register: xattrs_merge_dump
      changed_when: false

    - assert:
        that:
          - "'user.target_only=\"keep-me\"' in xattrs_merge_dump.stdout"
          - "'user.ansible_test=\"changed-value\"' in xattrs_merge_dump.stdout"
          - "'user.ansible_extra=\"extra-tag\"' in xattrs_merge_dump.stdout"

    # 7. check_mode does not touch the destination.
    - name: Check mode must not touch the destination
      copy:
        src: '{{ local_temp_dir }}/xattr_src.txt'
        dest: '{{ remote_dir }}/xattr_check_mode.txt'
        preserve_xattrs: source
      check_mode: yes
      register: xattr_check

    - stat:
        path: '{{ remote_dir }}/xattr_check_mode.txt'
      register: xattr_check_stat

    - assert:
        that:
          - xattr_check is changed
          - not xattr_check_stat.stat.exists

    # 8. remote_src path.
    - name: Prepare a remote source file
      copy:
        content: 'remote-src-xattr-content'
        dest: '{{ remote_dir }}/xattr_remote_src.txt'

    - command: setfattr -n user.ansible_remote -v 'remote-tag' {{ remote_dir }}/xattr_remote_src.txt

    - name: Copy with remote_src and preserve_xattrs=source
      copy:
        src: '{{ remote_dir }}/xattr_remote_src.txt'
        dest: '{{ remote_dir }}/xattr_remote_dst.txt'
        remote_src: true
        preserve_xattrs: source

    - command: getfattr --absolute-names -d -m '^user\.' {{ remote_dir }}/xattr_remote_dst.txt
      register: xattrs_remote_dst
      changed_when: false

    - assert:
        that:
          - "'user.ansible_remote=\"remote-tag\"' in xattrs_remote_dst.stdout"

    # 9. xattr_error_mode=warn keeps a non-Linux-style failure non-fatal.
    # We exercise the path by asking for source xattrs from a tmpfs-typed location
    # where they may be missing; the absence shouldn't fail the task.
    - name: Source with no xattrs at all
      copy:
        content: 'no-xattr-content'
        dest: '{{ local_temp_dir }}/no_xattr_src.txt'
      delegate_to: localhost

    - name: Copy with preserve_xattrs=source on a source that has no xattrs
      copy:
        src: '{{ local_temp_dir }}/no_xattr_src.txt'
        dest: '{{ remote_dir }}/no_xattr_dst.txt'
        preserve_xattrs: source
        xattr_error_mode: warn

    - command: getfattr --absolute-names -d -m '^user\.' {{ remote_dir }}/no_xattr_dst.txt
      register: no_xattr_dst_dump
      changed_when: false
      failed_when: false

    - assert:
        that:
          - "'user.' not in no_xattr_dst_dump.stdout"

    # 10. _xattrs_data is internal and must be rejected if the user tries to set it.
    - name: Reject user-supplied _xattrs_data
      copy:
        src: '{{ local_temp_dir }}/xattr_src.txt'
        dest: '{{ remote_dir }}/xattr_inject.txt'
        _xattrs_data:
          user.injected: 'aGVsbG8='
      register: inject_attempt
      ignore_errors: true

    - assert:
        that:
          - inject_attempt is failed
          - "'_xattrs_data' in (inject_attempt.msg | default(''))"

  always:
    - name: Clean up controller-side artefacts
      file:
        path: '{{ item }}'
        state: absent
      delegate_to: localhost
      loop:
        - '{{ local_temp_dir }}/xattr_src.txt'
        - '{{ local_temp_dir }}/no_xattr_src.txt'

    - name: Clean up remote xattr artefacts
      file:
        path: '{{ item }}'
        state: absent
      loop:
        - '{{ remote_dir }}/xattr_no.txt'
        - '{{ remote_dir }}/xattr_source.txt'
        - '{{ remote_dir }}/xattr_target.txt'
        - '{{ remote_dir }}/xattr_merge.txt'
        - '{{ remote_dir }}/xattr_remote_src.txt'
        - '{{ remote_dir }}/xattr_remote_dst.txt'
        - '{{ remote_dir }}/no_xattr_dst.txt'
