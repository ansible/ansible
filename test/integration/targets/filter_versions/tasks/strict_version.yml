- name: test strict_version with equal
  assert:
    that:
      - "(item[0] | strict_version == item[1] | strict_version) == item[2] | bool"
  loop:
    - ['1.0.0', '1.0.0', True]

- name: test strict_version with not equal
  assert:
    that:
      - "(item[0] | strict_version != item[1] | strict_version) == item[2] | bool"
  loop:
    - ['1.0.0', '1.0.0', False]

- name: test strict_version with less than
  assert:
    that:
      - "(item[0] | strict_version < item[1] | strict_version) == item[2] | bool"
  loop:
    - ['1.0.0', '2.0.0', True]

- name: test strict_version with greater than
  assert:
    that:
      - "(item[0] | strict_version > item[1] | strict_version) == item[2] | bool"
  loop:
    - ['1.0.0', '2.0.0', False]

- name: test strict_version with less than equal
  assert:
    that:
      - "(item[0] | strict_version <= item[1] | strict_version) == item[2] | bool"
  loop:
    - ['1.0.0', '1.0.0', True]
    - ['1.0.0', '2.0.0', True]

- name: test strict_version with greater than equal
  assert:
    that:
      - "(item[0] | strict_version >= item[1] | strict_version) == item[2] | bool"
  loop:
    - ['1.0.0', '1.0.0', True]
    - ['1.0.0', '2.0.0', False]
