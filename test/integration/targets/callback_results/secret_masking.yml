- hosts: localhost
  gather_facts: false
  vars:
    # avoids interpreter discovery adding a host specific fact to the first command result
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    simple_secret: ResultsCallbackSecret0060
    other_secret: ResultsCallbackOther0060
    # The quote and backslash are escaped and the newline and tab become \n and \t when serialized to JSON,
    # so the rendered text never contains the value itself.
    json_secret: "Results0060Json\"Quote\\Back\nNewLine\tTabEnd"
    # The apostrophe and ': ' force YAML single quoting with the apostrophe doubled, and the newline makes a
    # block scalar with each line indented, so the rendered text never contains the value itself.
    yaml_secret: "Results0060Yaml'Apos: Colon\nNewLine\tTabEnd"
    # The output is split into stdout_lines and stderr_lines before it is masked, where no single line contains the
    # value. The lines given to the callback must be built from the masked stdout and stderr instead.
    lines_secret: "Results0060Lines\nSecondLine0060\nThirdLine0060"
    # Registered by their string form while the result carries the raw number. The number must be redacted as a
    # string so the serialized output stays valid ("key": "$REDACTED$" rather than "key": $REDACTED$).
    int_secret: 12345678
    float_secret: 1234.5678
  # The expected result of each task is in secret_masking_expected, in a file named after its order and task name.
  tasks:
    - name: register_secrets
      set_fact:
        simple_secret: "{{ simple_secret | register_secret }}"
        other_secret: "{{ other_secret | register_secret }}"
        json_secret: "{{ json_secret | register_secret }}"
        yaml_secret: "{{ yaml_secret | register_secret }}"
        lines_secret: "{{ lines_secret | register_secret }}"
        int_str_secret: "{{ int_secret | string | register_secret }}"
        float_str_secret: "{{ float_secret | string | register_secret }}"

    - name: nested_values
      debug:
        msg:
          simple: "MARKER_SIMPLE {{ simple_secret }}"
          nested:
            - "MARKER_JSON {{ json_secret }}"
            - deeper:
                key: "MARKER_YAML {{ yaml_secret }}"
          int: "{{ int_secret }}"
          float: "{{ float_secret }}"
          # two secret keys mask to the same placeholder, both entries must be kept
          keys: "{{ {simple_secret: 'first', other_secret: 'second'} }}"

    # a multi-line secret in stdout and stderr
    - name: command_lines
      shell: |
        printf 'MARKER_STDOUT %s END\n' "${LINES_SECRET}"
        printf 'MARKER_STDERR %s END\n' "${LINES_SECRET}" >&2
      environment:
        LINES_SECRET: "{{ lines_secret }}"

    # a multi-line secret in stdout and stderr of each loop result
    - name: command_lines_loop
      shell: |
        printf 'MARKER_LOOP{{ item }}_STDOUT %s END\n' "${LINES_SECRET}"
        printf 'MARKER_LOOP{{ item }}_STDERR %s END\n' "${LINES_SECRET}" >&2
      environment:
        LINES_SECRET: "{{ lines_secret }}"
      loop: [1, 2]
