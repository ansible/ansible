- hosts: testhost
  gather_facts: false
  vars_prompt:
    - name: unvalidated
      default: default-secret
      encrypt: sha512_crypt
      salt: jESIyad4F08hP3Ta
    - name: validated
      default: default-secret
      encrypt: sha512_crypt
      salt: jESIyad4F08hP3Ta
      validate: validated == 'default-secret'
  tasks:
    - ansible.builtin.assert:
        that:
          - unvalidated == ('default-secret' | password_hash('sha512', 'jESIyad4F08hP3Ta'))
          - validated == unvalidated
        quiet: true
