- name: Test vars_prompt hashing
  hosts: testhost
  become: no
  gather_facts: no

  vars_prompt:
    - name: password
      confirm: yes
      encrypt: sha512_crypt
      salt: 'jESIyad4F08hP3Ta'

  tasks:
    - name: verify the prompted value produced the expected hash
      assert:
        that:
          - password == ('Scenic-Improving-Payphone' | password_hash('sha512', 'jESIyad4F08hP3Ta'))

    - debug:
        # The literal password here tests that the input value is registered
        # as a secret and will be redacted in the output.
        msg: Scenic-Improving-Payphone {{ password }}
