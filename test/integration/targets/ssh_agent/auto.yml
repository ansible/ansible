- hosts: testhost
  tasks:
    - set_fact:
        key_types:
          - ed25519
          - rsa
          - ecdsa

    - set_fact:
        key_types: "{{ key_types + ['dsa'] }}"
      when: ansible_distribution == "RedHat"

    - include_tasks: test_key.yml
      loop: "{{ key_types }}"
      loop_control:
        extended: true
