- name: Cleanup user account
  hosts: testhost

  tasks:
    - name: remove test user
      user:
        name: fetcher
        state: absent
        remove: yes
        force: yes

    - name: delete temporary directory
      file:
        path: "{{ remote_tmp_dir }}"
        state: absent
      when: remote_tmp_dir is defined
      no_log: yes
