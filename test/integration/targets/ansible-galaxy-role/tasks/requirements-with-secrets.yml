---
- name: Invalid requirements file
  copy:
    dest: secrets-requirements.yml
    content: "[{'src': 'git+https://username:password@127.0.0.1:9/nope/private-collection.git', 'name': 'secrets-testrole'}]"

- name: Install role with secrets in URL
  command: ansible-galaxy install -r secrets-requirements.yml
  ignore_errors: yes
  register: result

- name: Verify the role was installed
  assert:
    that:
      - result.stderr_lines is not search("username")
      - result.stderr_lines is not search("password")
