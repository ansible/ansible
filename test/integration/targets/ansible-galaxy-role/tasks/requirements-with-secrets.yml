---
- name: Requirement file with secrets in URL
  copy:
    dest: "{{ remote_tmp_dir }}/secrets-requirements.yml"
    content: |
      [{'src': 'git+https://username:password@127.0.0.1:9/nope/private-collection.git', 'name': 'secrets-testrole'},
      {'name': 'https://username:password@127.0.0.1:9/archive/rolename.tar.gz'}]

- name: Install roles with secrets in URL
  command: ansible-galaxy install -r {{ remote_tmp_dir }}/secrets-requirements.yml -vvv --ignore-errors
  register: result
  environment:
    ANSIBLE_NOCOLOR: True
    ANSIBLE_FORCE_COLOR: False

- name: Verify secrets are masked
  assert:
    that:
      # both roles are expected to fail, so their urls must show up in the output
      - output is search("127.0.0.1:9/nope/private-collection.git")
      - output is search("127.0.0.1:9/archive/rolename.tar.gz")
      - output is not search("username")
      - output is not search("password")
      - (output | regex_findall("\*\*\*\*:\*\*\*\*@127.0.0.1:9") | length) > 0
  vars:
    output: "{{ result.stdout }}\n{{ result.stderr }}"
