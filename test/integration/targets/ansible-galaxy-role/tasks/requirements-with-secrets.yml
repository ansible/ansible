---
- name: Requirement file with secrets in URL
  copy:
    dest: secrets-requirements.yml
    content: |
      [{'src': 'git+https://username:password@127.0.0.1:9/nope/private-collection.git', 'name': 'secrets-testrole'},
      {'name': 'https://username:password@127.0.0.1:9/archive/rolename.tar.gz'}]

- name: Install roles with secrets in URL
  command: ansible-galaxy install -r secrets-requirements.yml -vvv --ignore-errors
  register: result

- name: Verify the role was installed
  assert:
    that:
      - result.stderr_lines is not search("username")
      - result.stderr_lines is not search("password")
