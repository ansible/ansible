- name: Test that retrieving a url works
  set_fact:
    web_data: "{{ lookup('url', 'https://' ~ httpbin_host ~ '/get?one', split_lines=False) | from_json }}"

- name: Assert that the url was retrieved
  assert:
    that:
      - "'one' in web_data.args"

- name: Test that retrieving a url with invalid cert fails
  set_fact:
    web_data: "{{ lookup('url', 'https://' ~ badssl_host ~ '/') }}"
  ignore_errors: True
  register: url_invalid_cert

- assert:
    that:
      - "url_invalid_cert.failed"
      - "'Error validating the server' in url_invalid_cert.msg or 'Hostname mismatch' in url_invalid_cert.msg or ( url_invalid_cert.msg is search('hostname .* doesn.t match .*'))"

- name: Test that retrieving a url with invalid cert with validate_certs=False works
  set_fact:
    web_data: "{{ lookup('url', 'https://' ~ badssl_host ~ '/', validate_certs=False) }}"
  register: url_no_validate_cert

- assert:
    that:
      - badssl_host_substring in web_data

- name: Test ciphers
  import_tasks: ciphers.yml
  when: false  # skipped until we have a way to disable TLS 1.3 on the client or server, since cipher suite selection won't break TLS 1.3

- name: Test use_netrc=False
  import_tasks: use_netrc.yml

- vars:
    ansible_lookup_url_agent: ansible-test-lookup-url-agent
  block:
    - name: Test user agent
      set_fact:
        web_data: "{{ lookup('url', 'https://' ~ httpbin_host ~ '/user-agent', split_lines=False) | from_json }}"

    - name: Assert that user agent is set
      assert:
        that:
          - ansible_lookup_url_agent in web_data['user-agent']

- vars:
    ansible_lookup_url_force_basic_auth: yes
  block:
    - name: Test force basic auth
      set_fact:
        web_data: "{{ lookup('url', 'https://' ~ httpbin_host ~ '/headers', username='abc', split_lines=False) | from_json }}"

    - name: Assert that Authorization header is set
      assert:
        that:
          - "'Authorization' in web_data.headers"

- vars:
    # request header values supplied by the user, which must be registered as secrets
    secret_authorization: "Bearer LookupAuthorization0001Secret"
    secret_cookie: "session=LookupCookie0002Secret"
    # a request header which must not be masked
    marker_header: "LookupMarker0003NotSecret"
  block:
    - name: Test sensitive headers
      set_fact:
        web_data: "{{ lookup('url', 'https://' ~ httpbin_host ~ '/headers', split_lines=False, headers=headers) | from_json }}"
      vars:
        headers:
          Authorization: "{{ secret_authorization }}"
          Cookie: "{{ secret_cookie }}"
          X-Marker: "{{ marker_header }}"

    - name: Assert that the sensitive headers were sent and registered as secrets
      assert:
        that:
          - "'Authorization' in web_data.headers"
          # the values the user supplied are masked once the lookup has registered them
          - (secret_authorization | mask_secrets) == '$REDACTED$'
          - (secret_cookie | mask_secrets) == '$REDACTED$'
          # headers which are not sensitive are left alone
          - (marker_header | mask_secrets) == marker_header
