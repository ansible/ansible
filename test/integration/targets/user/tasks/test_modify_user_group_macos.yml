---
- name: run user module with empty groups param
  block:
    - name: remove test user for groups return test
      user:
        name: ansibulluser_groups
        state: absent

    - name: create group group4test
      group:
        name: group4test
        state: present

    - name: create test user with initial groups
      user:
        name: ansibulluser_groups
        groups:
          - daemon
          - group4test
        state: present
      register: user_groups_create

    - name: validate groups on initial creation
      assert:
        that:
          - user_groups_create.groups is defined
          - "'group4test' in user_groups_create.groups | split(',') | list"
          - "'daemon' in user_groups_create.groups | split(',') | list"

    - name: specify empty groups list without append
      user:
        name: ansibulluser_groups
        groups: []
        append: False
        state: present
      register: user_groups_remove

    - name: validate empty groups list without append removes all groups
      assert:
        that:
          - user_groups_remove.changed
          - user_groups_remove.groups is defined
          - "'group4test' not in user_groups_remove.groups | split(',') | list"
          - "'daemon' not in user_groups_remove.groups | split(',') | list"

    - name: add the groups back with append
      user:
        name: ansibulluser_groups
        groups:
          - group4test
          - daemon
        append: True
        state: present
      register: user_groups_add

    - name: validate groups after append includes all groups
      assert:
        that:
          - user_groups_add.changed
          - user_groups_add.groups is defined
          - "'group4test' in user_groups_add.groups | split(',') | list"
          - "'daemon' in user_groups_add.groups | split(',') | list"

    - name: specify empty groups list with append
      user:
        name: ansibulluser_groups
        groups: []
        append: True
        state: present
      register: user_groups_append

    - name: validate empty groups list with append keeps existing groups
      assert:
        that:
          - not user_groups_append.changed
          - user_groups_append.groups is defined
          - "'group4test' in user_groups_append.groups | split(',') | list"
          - "'daemon' in user_groups_append.groups | split(',') | list"

  always:
    - name: clean up test user
      user:
        name: ansibulluser_groups
        state: absent

    - name: remove group group4test
      group:
        name: group4test
        state: absent
