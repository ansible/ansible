---
- name: run user module with empty groups param
  block:
    - name: remove test user for groups return test
      user:
        name: ansibulluser_groups
        state: absent

    - name: create test user with initial groups
      user:
        name: ansibulluser_groups
        groups:
          - daemon
          - bin
        state: present
      register: user_groups_create

    - command: id ansibulluser_groups

    - name: validate groups on initial creation
      assert:
        that:
          - user_groups_create.groups is defined
          - "'bin' in user_groups_create.groups"
          - "'daemon' in user_groups_create.groups"

    - name: specify empty groups list
      user:
        name: ansibulluser_groups
        groups: []
        append: False
        state: present
      register: user_groups_remove

    - command: id ansibulluser_groups

    - name: validate groups after append includes all groups
      assert:
        that:
          - user_groups_remove.changed
          - user_groups_remove.groups is defined
          - "'bin' not in user_groups_remove.groups"
          - "'daemon' not in user_groups_remove.groups"

    - name: Add groups again
      user:
        name: ansibulluser_groups
        groups:
          - bin
          - daemon
        append: True
        state: present
      register: user_groups_add

    - command: id ansibulluser_groups

    - name: validate groups after append includes all groups
      assert:
        that:
          - user_groups_add.changed
          - user_groups_add.groups is defined
          - "'bin' in user_groups_add.groups"
          - "'daemon' in user_groups_add.groups"

    - name: Add groups again
      user:
        name: ansibulluser_groups
        groups: []
        append: True
        state: present
      register: user_groups_append

    - name: validate groups after append includes all groups
      assert:
        that:
          - not user_groups_append.changed
          - user_groups_append.groups is defined
          - "'bin' in user_groups_append.groups"
          - "'daemon' in user_groups_append.groups"

  always:
    - name: clean up test user
      user:
        name: ansibulluser_groups
        state: absent
