# Verify that setting a user's password hash is applied correctly when the
# module passes the hash to `chpasswd -e` over stdin instead of putting it on
# the useradd/usermod command line (issue 65711 / 71209). The stored hash must
# be correct and idempotent, and must still honor update_password and
# password_lock. These tests assert the observable result in /etc/shadow, so
# they pass regardless of whether the hash is applied by chpasswd or, where
# chpasswd is unavailable, by the command-line fallback.

- name: password set over stdin
  when: ansible_facts.system == 'Linux'
  vars:
    stdin_pw_hash1: "$6$stdintest1$yQz54i67GYg1j5vye8lroW01T0UFWphEXXI2w/1nLOAy5FhuYc0jgDYGf8M7Qw5BHEXWQvRAj0df/ShsvEDYY1"  # gitleaks:allow
    stdin_pw_hash2: "$6$stdintest2$hpo1SDwFtmzkT3Dd8qbu8Vgxrfp87z3jDWq5L0z.fPK9qG6xrdfwpjsGfyRuJicx0zEiPBkqicDV4UDySYPI00"  # gitleaks:allow
  block:
    - name: make sure the stdin password test user is absent first
      user:
        name: ansibulluser_stdin
        state: absent
        remove: true

    - name: create a user with an sha512 password hash
      user:
        name: ansibulluser_stdin
        password: "{{ stdin_pw_hash1 }}"
        update_password: always
      register: stdin_create

    - name: read the shadow entry after create
      getent:
        database: shadow
        key: ansibulluser_stdin

    - name: the requested hash is stored verbatim and nothing is warned
      assert:
        that:
          - stdin_create is changed
          - "'warnings' not in stdin_create"
          - getent_shadow['ansibulluser_stdin'][0] == stdin_pw_hash1
        fail_msg: "the sha512 hash was not stored verbatim in /etc/shadow"

    - name: set the same hash again
      user:
        name: ansibulluser_stdin
        password: "{{ stdin_pw_hash1 }}"
        update_password: always
      register: stdin_noop

    - name: re-applying the same hash is idempotent
      assert:
        that:
          - stdin_noop is not changed

    - name: update the user to a different hash
      user:
        name: ansibulluser_stdin
        password: "{{ stdin_pw_hash2 }}"
        update_password: always
      register: stdin_update

    - name: read the shadow entry after update
      getent:
        database: shadow
        key: ansibulluser_stdin

    - name: the stored hash is now the new hash
      assert:
        that:
          - stdin_update is changed
          - getent_shadow['ansibulluser_stdin'][0] == stdin_pw_hash2

    - name: run again with update_password on_create
      user:
        name: ansibulluser_stdin
        password: "{{ stdin_pw_hash1 }}"
        update_password: on_create
      register: stdin_on_create

    - name: read the shadow entry after on_create
      getent:
        database: shadow
        key: ansibulluser_stdin

    - name: on_create leaves the existing hash untouched
      assert:
        that:
          - stdin_on_create is not changed
          - getent_shadow['ansibulluser_stdin'][0] == stdin_pw_hash2

    - name: lock the account while setting the password
      user:
        name: ansibulluser_stdin
        password: "{{ stdin_pw_hash1 }}"
        password_lock: true
        update_password: always
      register: stdin_lock

    - name: read the shadow entry after lock
      getent:
        database: shadow
        key: ansibulluser_stdin

    - name: the stored hash is locked with a single exclamation prefix
      assert:
        that:
          - stdin_lock is changed
          - getent_shadow['ansibulluser_stdin'][0] == '!' ~ stdin_pw_hash1
        fail_msg: "a locked account should store '!' + hash, with no separate -L step corrupting the hash"

    - name: unlock the account
      user:
        name: ansibulluser_stdin
        password: "{{ stdin_pw_hash1 }}"
        password_lock: false
        update_password: always
      register: stdin_unlock

    - name: read the shadow entry after unlock
      getent:
        database: shadow
        key: ansibulluser_stdin

    - name: the hash is unlocked and intact
      assert:
        that:
          - stdin_unlock is changed
          - getent_shadow['ansibulluser_stdin'][0] == stdin_pw_hash1

    - name: change the shell and the password in the same task
      user:
        name: ansibulluser_stdin
        password: "{{ stdin_pw_hash2 }}"
        shell: /bin/sh
        update_password: always
      register: stdin_combined

    - name: read passwd and shadow after the combined change
      getent:
        database: "{{ item }}"
        key: ansibulluser_stdin
      loop:
        - passwd
        - shadow

    - name: both the shell and the new hash are applied
      assert:
        that:
          - stdin_combined is changed
          - getent_passwd['ansibulluser_stdin'][5] == '/bin/sh'
          - getent_shadow['ansibulluser_stdin'][0] == stdin_pw_hash2

  always:
    - name: remove the stdin password test user
      user:
        name: ansibulluser_stdin
        state: absent
        remove: true
