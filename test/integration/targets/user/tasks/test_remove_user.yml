- name: try to delete the user
  user:
    name: ansibulluser
    state: absent
    force: true
  register: user_test2

- name: make a new list of users
  script: userlist.sh {{ ansible_facts.distribution }}
  register: user_names2

- debug:
    var: user_names2
    verbosity: 2

- name: validate results for testcase 2
  assert:
    that:
      - '"ansibulluser" not in user_names2.stdout_lines'

- name: test deletion of a user also removes SELinux user mappings
  when: ansible_facts.selinux.status is defined and ansible_facts.selinux.status == 'enabled'
  vars:
    selinux_username: ansibullselinux
  block:
    - name: create a user with an SELinux user mapping
      user:
        name: '{{ selinux_username }}'
        state: present
        seuser: unconfined_u

    - name: check SELinux user mapping exists
      shell: grep -r '{{ selinux_username }}' /etc/selinux 2>/dev/null | wc -l
      register: selinux_mapping_before

    - name: delete the user
      user:
        name: '{{ selinux_username }}'
        state: absent
        force: true

    - name: check SELinux user mapping after deletion
      shell: grep -r '{{ selinux_username }}' /etc/selinux 2>/dev/null | wc -l
      register: selinux_mapping_after

    - name: validate SELinux user mapping was removed
      assert:
        that:
          - selinux_mapping_before.stdout | int > 0
          - selinux_mapping_after.stdout | int == 0
  always:
    - name: ensure the test user is removed
      user:
        name: '{{ selinux_username }}'
        state: absent
        force: true
      register: selinux_test_cleanup
      failed_when: false
