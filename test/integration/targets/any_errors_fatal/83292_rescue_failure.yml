---
- name: Keep rescued run_once terminal failures out of later tasks
  hosts: testhost,testhost2
  gather_facts: false
  tasks:
    - name: Fail once before a failing rescue
      block:
        - name: Fail once
          ansible.builtin.fail:
          run_once: true
      rescue:
        - name: Fail the rescue for each host
          ansible.builtin.fail:
            msg: 83292 rescue failure {{ inventory_hostname }}

    - name: Do not continue after a failed rescue
      ansible.builtin.debug:
        msg: SHOULD NOT HAPPEN
