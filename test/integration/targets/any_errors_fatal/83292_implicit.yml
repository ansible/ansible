---
- name: Rescued run_once failure without explicit any_errors_fatal
  hosts: testhost,testhost2
  gather_facts: false
  tasks:
    - name: Exercise implicit fatal behavior of run_once
      block:
        - name: Fail once
          fail:
          run_once: true

        - name: Do not continue inside a failed block
          debug:
            msg: SHOULD NOT HAPPEN
      rescue:
        - name: Rescue both hosts
          debug:
            msg: 83292 implicit rescue

    - name: Continue both hosts after rescue
      debug:
        msg: 83292 implicit recovered
