---
- name: Rescued run_once failure without explicit any_errors_fatal
  hosts: testhost,testhost2
  gather_facts: false
  tasks:
    - name: Exercise implicit fatal behavior of run_once
      block:
        - name: Fail once
          fail:
          run_once: true

        - name: Do not continue inside a failed block
          debug:
            msg: SHOULD NOT HAPPEN
      rescue:
        - name: Rescue both hosts
          ansible.builtin.assert:
            that:
              - ansible_play_hosts | sort == ['testhost', 'testhost2']
              - ansible_play_batch | sort == ['testhost', 'testhost2']
            success_msg: 83292 implicit rescue {{ inventory_hostname }}

    - name: Continue both hosts after rescue
      ansible.builtin.assert:
        that:
          - ansible_play_hosts | sort == ['testhost', 'testhost2']
          - ansible_play_batch | sort == ['testhost', 'testhost2']
        success_msg: 83292 implicit recovered {{ inventory_hostname }}
