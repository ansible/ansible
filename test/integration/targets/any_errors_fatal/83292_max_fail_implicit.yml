---
- name: Rescued run_once failure with implicit fatal behavior and max-fail threshold
  hosts: testhost,testhost2
  gather_facts: false
  max_fail_percentage: '{{ max_fail_pct }}'
  tasks:
    - name: Exercise implicit run_once failure with max-fail threshold
      block:
        - name: Fail once
          command: /bin/false
          run_once: true

        - name: Do not continue inside a failed block
          debug:
            msg: SHOULD NOT HAPPEN
      rescue:
        - name: Rescue both hosts after max-fail threshold
          ansible.builtin.assert:
            that:
              - ansible_play_hosts | sort == ['testhost', 'testhost2']
              - ansible_play_batch | sort == ['testhost', 'testhost2']
            success_msg: 83292 maxfail implicit rescue {{ inventory_hostname }}

    - name: Continue both hosts after max-fail rescue
      ansible.builtin.assert:
        that:
          - ansible_play_hosts | sort == ['testhost', 'testhost2']
          - ansible_play_batch | sort == ['testhost', 'testhost2']
        success_msg: 83292 maxfail implicit recovered {{ inventory_hostname }}
