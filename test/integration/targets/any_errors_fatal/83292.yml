---
- name: Rescued run_once failure with explicit any_errors_fatal
  hosts: testhost,testhost2
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Exercise explicit run_once failure
      block:
        - name: Fail once
          fail:
          run_once: true

        - name: Do not continue inside a failed block
          debug:
            msg: SHOULD NOT HAPPEN
      rescue:
        - name: Rescue both hosts
          debug:
            msg: 83292 explicit rescue

    - name: Continue both hosts after rescue
      debug:
        msg: 83292 explicit recovered

- name: Rescued run_once failure without explicit any_errors_fatal
  hosts: testhost,testhost2
  gather_facts: false
  tasks:
    - name: Exercise implicit fatal behavior of run_once
      block:
        - name: Fail once
          fail:
          run_once: true

        - name: Do not continue inside a failed block
          debug:
            msg: SHOULD NOT HAPPEN
      rescue:
        - name: Rescue both hosts
          debug:
            msg: 83292 implicit rescue

    - name: Continue both hosts after rescue
      debug:
        msg: 83292 implicit recovered

- name: Rescued failure from an action that bypasses the host loop
  hosts: testhost,testhost2
  gather_facts: false
  tasks:
    - name: Exercise implicit run_once behavior of the action
      block:
        - name: Fail because the required host name is missing
          add_host:

        - name: Do not continue inside a failed block
          debug:
            msg: SHOULD NOT HAPPEN
      rescue:
        - name: Rescue both hosts
          debug:
            msg: 83292 bypass rescue

    - name: Continue both hosts after rescue
      debug:
        msg: 83292 bypass recovered
