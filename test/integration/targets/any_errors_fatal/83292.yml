- name: Test rescuing hosts failed via any_errors_fatal/run_once
  hosts: testhost,testhost2
  gather_facts: false
  tasks:
    - name: Test failed hosts with any_errors_fatal
      any_errors_fatal: true
      block:
        - fail:
        - debug:
            msg: SHOULD NOT HAPPEN
      rescue:
        - debug:
            msg: EXPECTED

    - name: Test failed hosts with run_once
      block:
        - fail:
          run_once: True
        - debug:
            msg: SHOULD NOT HAPPEN
      rescue:
        - debug:
            msg: EXPECTED

    - name: Test failed hosts with implicit run_once
      block:
        - add_host:  # missing host args, this fails
        - debug:
            msg: SHOULD NOT HAPPEN
      rescue:
        - debug:
            msg: EXPECTED

    - name: Test failed hosts with any_errors_fatal and run_once
      any_errors_fatal: True
      block:
        - fail:
        - debug:
            msg: SHOULD NOT HAPPEN
      rescue:
        - debug:
            msg: EXPECTED
