---
- name: Rescued run_once failure with explicit any_errors_fatal
  hosts: testhost,testhost2
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Exercise explicit run_once failure
      block:
        - name: Fail once
          fail:
          run_once: true

        - name: Do not continue inside a failed block
          debug:
            msg: SHOULD NOT HAPPEN
      rescue:
        - name: Rescue both hosts
          ansible.builtin.assert:
            that:
              - ansible_play_hosts | sort == ['testhost', 'testhost2']
              - ansible_play_batch | sort == ['testhost', 'testhost2']
            success_msg: 83292 explicit rescue {{ inventory_hostname }}

    - name: Continue both hosts after rescue
      ansible.builtin.assert:
        that:
          - ansible_play_hosts | sort == ['testhost', 'testhost2']
          - ansible_play_batch | sort == ['testhost', 'testhost2']
        success_msg: 83292 explicit recovered {{ inventory_hostname }}
