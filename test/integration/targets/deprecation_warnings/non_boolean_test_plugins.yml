---
- hosts: localhost
  gather_facts: no
  tasks:
    - name: a test plugin returning a boolean does not deprecate
      assert:
        that:
          - true is passthru
          - false is not passthru

    - name: a test plugin returning a non-boolean is deprecated and coerced to a boolean
      assert:
        that:
          - "'a string' is passthru"
          - 1 is passthru
          - 0 is not passthru
          - "'' is not passthru"
