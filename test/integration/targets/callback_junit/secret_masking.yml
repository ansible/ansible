- hosts: localhost
  gather_facts: false
  vars:
    simple_secret: JunitCallbackSecret0060
    # The angle brackets, ampersand and quotes are written as XML entities in the report, so the rendered
    # text never contains the value itself.
    xml_secret: "Junit0060Xml<Tag>&Amp\"Quote\"'Apos'End"
  tasks:
    - set_fact:
        simple_secret: "{{ simple_secret | register_secret }}"
        xml_secret: "{{ xml_secret | register_secret }}"

    - debug:
        msg:
          simple_secret: "MARKER_SIMPLE {{ simple_secret }}"
          xml_secret: "MARKER_XML {{ xml_secret }}"
