trigger:
  batch: true
  branches:
    include:
      - devel
      - stable-*

pr:
  autoCancel: true
  branches:
    include:
      - devel
      - stable-*

schedules:
  - cron: 0 7 * * *
    displayName: Nightly
    always: true
    branches:
      include:
        - devel
        - stable-*

variables:
  - name: checkoutPath
    value: ansible
  - name: coverageBranches
    value: devel
  - name: entryPoint
    value: .azure-pipelines/commands/entry-point.sh
  - name: fetchDepth
    value: 500
  - name: defaultContainer
    value: quay.io/ansible/azure-pipelines-test-container:8.0.0

pool: Standard

stages:
  - stage: Windows
    dependsOn: []
    jobs:
      - template: templates/matrix.yml
        parameters:
          nameFormat: Server {0}
          testFormat: windows/{0}/1
          targets:
            - name: 2019 WinRM HTTPS WinPS
              test: 2019/winrm/https/5.1
            - name: 2022 WinRM HTTPS WinPS
              test: 2022/winrm/https/5.1
            - name: 2022 PSRP HTTP WinPS
              test: 2022/psrp/http/5.1
            - name: 2022 SSH Key WinPS
              test: 2022/ssh/key/5.1
            - name: 2025 PSRP HTTP WinPS
              test: 2025/psrp/http/5.1
            - name: 2025 SSH Key WinPS
              test: 2025/ssh/key/5.1
            - name: 2025 WinRM HTTP Pwsh
              test: 2025/winrm/http/7.6
            - name: 2025 PSRP HTTP Pwsh
              test: 2025/psrp/http/7.6
            - name: 2025 SSH Key Pwsh
              test: 2025/ssh/key/7.6
  - stage: Remote
    dependsOn: []
    jobs:
      - template: templates/matrix.yml  # context/target
        parameters:
          targets:
            - name: macOS 26.3
              test: macos/26.3
            - name: RHEL 9.8
              test: rhel/9.8
            - name: RHEL 10.2 py312
              test: rhel/10.2@3.12
            - name: RHEL 10.2 py314
              test: rhel/10.2@3.14
            - name: FreeBSD 14.5
              test: freebsd/14.5
            - name: FreeBSD 15.1
              test: freebsd/15.1
          groups:
            - 1
            - 2
      - template: templates/matrix.yml  # context/controller
        parameters:
          targets:
            - name: macOS 26.3
              test: macos/26.3
            - name: RHEL 9.8
              test: rhel/9.8
            - name: RHEL 10.2
              test: rhel/10.2
            - name: FreeBSD 14.5
              test: freebsd/14.5
            - name: FreeBSD 15.1
              test: freebsd/15.1
          groups:
            - 3
            - 4
            - 5
      - template: templates/matrix.yml  # context/controller (ansible-test container management)
        parameters:
          targets:
            - name: Alpine 3.24
              test: alpine/3.24
            - name: Fedora 44
              test: fedora/44
            - name: RHEL 9.8
              test: rhel/9.8
            - name: RHEL 10.2
              test: rhel/10.2
            - name: Ubuntu 26.04
              test: ubuntu/26.04
          groups:
            - 6
  - stage: Remote_Targeted
    displayName: Remote Targeted
    dependsOn: []
    jobs:
      - template: templates/matrix.yml  # targeted tests
        parameters:
          testFormat: "{0}/targeted"
          targets:
            - name: RHEL 8.10
              test: rhel/8.10/rhel8
  - stage: Incidental_Windows
    displayName: Incidental Windows
    dependsOn: []
    jobs:
      - template: templates/matrix.yml
        parameters:
          nameFormat: Server {0}
          testFormat: i/windows/{0}
          targets:
            - name: 2019 WinRM HTTPS WinPS
              test: 2019/winrm/https/5.1
            - name: 2022 WinRM HTTPS WinPS
              test: 2022/winrm/https/5.1
            - name: 2022 PSRP HTTP WinPS
              test: 2022/psrp/http/5.1
            - name: 2022 SSH Key WinPS
              test: 2022/ssh/key/5.1
            - name: 2025 PSRP HTTP WinPS
              test: 2025/psrp/http/5.1
            - name: 2025 SSH Key WinPS
              test: 2025/ssh/key/5.1
            - name: 2025 WinRM HTTP Pwsh
              test: 2025/winrm/http/7.6
            - name: 2025 PSRP HTTP Pwsh
              test: 2025/psrp/http/7.6
            - name: 2025 SSH Key Pwsh
              test: 2025/ssh/key/7.6
  - stage: Summary
    condition: succeededOrFailed()
    dependsOn:
      - Windows
      - Remote
      - Remote_Targeted
      - Incidental_Windows
    jobs:
      - template: templates/coverage.yml
