            - name: FreeBSD 13.4
              test: freebsd/13.4
            - name: FreeBSD 14.2
              test: freebsd/14.2
          groups:
            - x86_64@3
            - x86_64@4
            - x86_64@5
      - template: templates/matrix.yml  # context/controller (ansible-test container management)
        parameters:
          targets:
            - name: Alpine 3.21
